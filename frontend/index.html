<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- ?v= on every icon: bump it whenever an icon's picture changes, so no
         phone or browser can keep showing the old one from a saved copy. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <!-- Pinch-zoom is off because this is used as an app, not read as a page.
         A supplier billing one-handed in a godown pinches by accident and ends
         up half a screen sideways with no idea how to get back — which is
         exactly what happened. maximum-scale alone is ignored without
         user-scalable, so both are set. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>BuildSupply</title>
    <!-- Installable on a phone's home screen and usable on a weak shop
         connection — see public/sw.js. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Must match --color-shell, the mobile header's background. Android
         paints the status bar strip with this colour in an installed app, so
         anything else here shows as a band of a different colour sitting on
         top of the header. It was the brand green against a dark teal header,
         which is exactly what that looked like. --color-shell is deliberately
         the same in light and dark, so one value covers both themes. -->
    <meta name="theme-color" content="#0A2427" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BuildSupply" />
    <!-- Full-bleed square: iOS rounds the corners itself, and would show the
         rounded icon's transparent corners as black. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
  </head>
  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
